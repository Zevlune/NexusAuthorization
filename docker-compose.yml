name: nexusauthorization
services:
  permission-api:
    image: 18790997531/nexusauthorization-api:1.0.2
    platform: linux/amd64
    environment:
      NEXUSAUTHORIZATION_DATABASE_URL: ${NEXUSAUTHORIZATION_DATABASE_URL:?Configure external PostgreSQL connection in .env}
      NEXUSAUTHORIZATION_OIDC_ENABLED: 'true'
      NEXUSAUTHORIZATION_OIDC_AUTHORITY: ${NEXUSAUTHORIZATION_OIDC_AUTHORITY:?Configure public OIDC authority in .env}
      NEXUSAUTHORIZATION_OIDC_CLIENT_ID: ${NEXUSAUTHORIZATION_OIDC_CLIENT_ID:-permission.center}
      NEXUSAUTHORIZATION_OIDC_CLIENT_SECRET: ${NEXUSAUTHORIZATION_OIDC_CLIENT_SECRET:?Configure OIDC client secret in .env}
      NEXUSAUTHORIZATION_OIDC_REDIRECT_URI: ${NEXUSAUTHORIZATION_OIDC_REDIRECT_URI:?Configure public OIDC redirect URI in .env}
      NEXUSAUTHORIZATION_OIDC_POST_LOGOUT_REDIRECT_URI: ${NEXUSAUTHORIZATION_OIDC_POST_LOGOUT_REDIRECT_URI:?Configure public post-logout URI in .env}
      NEXUSAUTHORIZATION_OIDC_SCOPES: ${NEXUSAUTHORIZATION_OIDC_SCOPES:-openid,profile,offline_access,permission.center.api}
      NEXUSAUTHORIZATION_OIDC_AUDIENCE: ${NEXUSAUTHORIZATION_OIDC_AUDIENCE:-permission.center.api}
      NEXUSAUTHORIZATION_SERVICE_RESOURCE_SOURCE: ${NEXUSAUTHORIZATION_SERVICE_RESOURCE_SOURCE:-nexusauth}
      NEXUSAUTHORIZATION_SERVICE_RESOURCE_NEXUSAUTH_BASE_URL: ${NEXUSAUTHORIZATION_SERVICE_RESOURCE_NEXUSAUTH_BASE_URL:?Configure NexusAuth service resource URL in .env}
      NEXUSAUTHORIZATION_SERVICE_RESOURCE_API_KEY: ${NEXUSAUTHORIZATION_SERVICE_RESOURCE_API_KEY:?Configure service resource API key in .env}
      NEXUSAUTHORIZATION_SCIM_NEXUSAUTH_BASE_URL: ${NEXUSAUTHORIZATION_SCIM_NEXUSAUTH_BASE_URL:?Configure SCIM base URL in .env}
      NEXUSAUTHORIZATION_SCIM_API_KEY: ${NEXUSAUTHORIZATION_SCIM_API_KEY:?Configure SCIM API key in .env}
      NEXUSAUTHORIZATION_SCIM_TIMEOUT: ${NEXUSAUTHORIZATION_SCIM_TIMEOUT:-5s}
    volumes:
      - session-data:/app/data
    expose: ['8080']
    healthcheck:
      test: [CMD, wget, --quiet, --spider, 'http://127.0.0.1:8080/healthz']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  dashboard:
    image: 18790997531/nexusauthorization-dashboard:1.0.2
    platform: linux/amd64
    ports:
      - '${DASHBOARD_BIND_ADDR:-0.0.0.0}:${DASHBOARD_PORT:-5274}:80'
    depends_on:
      permission-api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --quiet, --spider, 'http://127.0.0.1/']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  session-data:
