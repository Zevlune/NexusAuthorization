name: nexusauthorization-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus-authorization}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55434}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: [redis-server, --save, '', --appendonly, 'no']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  nexus-authorization:
    image: 18790997531/nexusauthorization-api:1.0.2
    platform: linux/amd64
    environment:
      LUCKENV: ${LUCKENV:?set LUCKENV to the runtime environment}
      SERVICEUK: ${SERVICEUK:?set SERVICEUK to the service resource key}
      NEXUSAUTHORIZATION_DATABASE_URL: "host=postgres port=5432 dbname=${POSTGRES_DB:-nexus-authorization} user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:-postgres} sslmode=disable"
      NEXUSAUTHORIZATION_REDIS_ENABLED: ${NEXUSAUTHORIZATION_REDIS_ENABLED:-true}
      NEXUSAUTHORIZATION_REDIS_URL: ${NEXUSAUTHORIZATION_REDIS_URL:-redis://redis:6379/0}
      NEXUSAUTHORIZATION_REDIS_CACHE_TTL: ${NEXUSAUTHORIZATION_REDIS_CACHE_TTL:-24h}
      NEXUSAUTHORIZATION_REDIS_TIMEOUT: ${NEXUSAUTHORIZATION_REDIS_TIMEOUT:-200ms}
      NEXUSAUTHORIZATION_AUTHORIZATION_SERVICE_CREDENTIAL: ${NEXUSAUTHORIZATION_AUTHORIZATION_SERVICE_CREDENTIAL:-}
      NEXUSAUTHORIZATION_OIDC_ENABLED: '${NEXUSAUTHORIZATION_OIDC_ENABLED:-false}'
      NEXUSAUTHORIZATION_OIDC_AUTHORITY: ${NEXUSAUTHORIZATION_OIDC_AUTHORITY:-http://localhost:5100}
      NEXUSAUTHORIZATION_OIDC_BACKCHANNEL_AUTHORITY: ${NEXUSAUTHORIZATION_OIDC_BACKCHANNEL_AUTHORITY:-}
      NEXUSAUTHORIZATION_OIDC_CLIENT_ID: ${NEXUSAUTHORIZATION_OIDC_CLIENT_ID:-permission.center}
      NEXUSAUTHORIZATION_OIDC_CLIENT_SECRET: ${NEXUSAUTHORIZATION_OIDC_CLIENT_SECRET:-}
      NEXUSAUTHORIZATION_OIDC_REDIRECT_URI: ${NEXUSAUTHORIZATION_OIDC_REDIRECT_URI:-http://localhost:5274/signin-oidc}
      NEXUSAUTHORIZATION_OIDC_POST_LOGOUT_REDIRECT_URI: ${NEXUSAUTHORIZATION_OIDC_POST_LOGOUT_REDIRECT_URI:-http://localhost:5274/}
      NEXUSAUTHORIZATION_OIDC_SCOPES: ${NEXUSAUTHORIZATION_OIDC_SCOPES:-openid,profile,offline_access,permission.center.api}
      NEXUSAUTHORIZATION_OIDC_AUDIENCE: ${NEXUSAUTHORIZATION_OIDC_AUDIENCE:-permission.center.api}
      NEXUSAUTHORIZATION_SERVICE_RESOURCE_SOURCE: ${NEXUSAUTHORIZATION_SERVICE_RESOURCE_SOURCE:-local}
      NEXUSAUTHORIZATION_SERVICE_RESOURCE_NEXUSAUTH_BASE_URL: ${NEXUSAUTHORIZATION_SERVICE_RESOURCE_NEXUSAUTH_BASE_URL:-http://host.docker.internal:5100}
      NEXUSAUTHORIZATION_SERVICE_RESOURCE_API_KEY: ${NEXUSAUTHORIZATION_SERVICE_RESOURCE_API_KEY:-}
      NEXUSAUTHORIZATION_SCIM_NEXUSAUTH_BASE_URL: ${NEXUSAUTHORIZATION_SCIM_NEXUSAUTH_BASE_URL:-}
      NEXUSAUTHORIZATION_SCIM_API_KEY: ${NEXUSAUTHORIZATION_SCIM_API_KEY:-}
      NEXUSAUTHORIZATION_SCIM_TIMEOUT: ${NEXUSAUTHORIZATION_SCIM_TIMEOUT:-5s}
    volumes:
      - session-data:/app/data
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose: ['8080']
    networks:
      default:
        # dashboard/nginx.conf proxies to this name.
        aliases: [nexusauthorization-api]
    healthcheck:
      test: [CMD, wget, --quiet, --spider, 'http://127.0.0.1:8080/api/healthz']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  dashboard:
    image: 18790997531/nexusauthorization-dashboard:1.0.2
    platform: linux/amd64
    ports:
      - '${DASHBOARD_BIND_ADDR:-127.0.0.1}:${DASHBOARD_PORT:-5274}:80'
    depends_on:
      nexus-authorization:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --quiet, --spider, 'http://127.0.0.1/']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  session-data:
