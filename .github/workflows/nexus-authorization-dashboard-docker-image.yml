name: Build and Push NexusAuthorization Dashboard Docker Image
run-name: Build and push NexusAuthorization Dashboard:${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (for example, 1.0.2 or latest)'
        required: true
        type: string

permissions:
  contents: read

env:
  DOCKER_IMAGE: 18790997531/nexusauthorization-dashboard

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Validate image tag
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo '::error::Invalid Docker tag. Use 1-128 letters, digits, underscores, dots or hyphens; start with a letter, digit or underscore.'
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Yarn
        run: npm install --global yarn@1.22.22

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: yarn install --frozen-lockfile

      - name: Build dashboard
        working-directory: dashboard
        run: yarn build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Configure these credentials in the repository's GitHub Actions secrets.
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push NexusAuthorization Dashboard image
        uses: docker/build-push-action@v7
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ inputs.tag }}
          cache-from: type=gha,scope=nexusauthorization-dashboard
          cache-to: type=gha,scope=nexusauthorization-dashboard,mode=max
