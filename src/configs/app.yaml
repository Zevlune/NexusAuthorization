http:
  addr: ":8080"
logging:
  module: "NexusAuthorization"
  minimum_level: "info"
  # Set a path such as "logs/permission-center-go.log" to also write to a file.
  file_path: ""
database:
  url: "postgres://postgres:postgres@localhost:55433/permission_center?sslmode=disable"
  max_conns: 10
  min_conns: 2
service_resource:
  source: "nexusauth"
  nexusauth_base_url: "http://localhost:5100"
  # Configure a targetType=service_resource Open API credential through
  # NEXUSAUTHORIZATION_SERVICE_RESOURCE_API_KEY in production.
  api_key: ""
  timeout: "5s"
authorization:
  # Required by the service-to-service /v1/authorize endpoint in production.
  service_credential: ""
api_tokens:
  service_resource: "nexusauthorization"
  # Required in OIDC mode; subjects are NexusAuth user IDs, not usernames.
  admin_subjects: []
  # Independent callback key; loaded at startup, not managed as an API Token.
  # internal_callers:
  #   - service_resource: "nexusauth"
  #     key: "<at-least-32-random-bytes>"
  internal_callers: []
oidc:
  enabled: false
  authority: "http://localhost:5100"
  backchannel_authority: ""
  client_id: "permission.center"
  client_secret: "replace-with-client-secret"
  redirect_uri: "http://localhost:8080/signin-oidc"
  post_logout_redirect_uri: "http://localhost:5274/"
  scopes: ["openid", "profile", "offline_access", "permission.center.api"]
  audience: "permission.center.api"
  session_secret: "replace-with-at-least-32-random-characters"
