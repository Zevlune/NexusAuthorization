http:
  addr: ":8080"
logging:
  module: "NexusAuthorization"
  minimum_level: "info"
  # Set a path such as "logs/nexus-authorization.log" to also write to a file.
  file_path: ""
database:
  url: "postgres://postgres:postgres@localhost:55434/nexus-authorization?sslmode=disable"
  max_conns: 10
  min_conns: 2
# Service API authorization uses Redis by default. Set enabled: false to use
# database current-policy authorization without creating a Redis client.
redis:
  enabled: true
  url: ""
  key_prefix: "nexusauthorization:dev"
  cache_ttl: "24h"
  timeout: "200ms"
service_resource:
  source: "nexusauth"
  nexusauth_base_url: "http://localhost:5100"
  # Configure a targetType=service_resource Open API credential through
  # NEXUSAUTHORIZATION_SERVICE_RESOURCE_API_KEY in production.
  api_key: ""
  timeout: "5s"
authorization:
  # Legacy service credential; empty keeps /api/v1/authorize closed until unified Open API token management is integrated.
  service_credential: ""
scim:
  # Optional read-only NexusAuth user directory. Set URL and credential through
  # NEXUSAUTHORIZATION_SCIM_NEXUSAUTH_BASE_URL and NEXUSAUTHORIZATION_SCIM_API_KEY.
  nexusauth_base_url: ""
  api_key: ""
  timeout: "5s"
oidc:
  enabled: false
  authority: "http://localhost:5100"
  backchannel_authority: ""
  client_id: "permission.center"
  client_secret: "replace-with-client-secret"
  redirect_uri: "http://localhost:8080/signin-oidc"
  post_logout_redirect_uri: "http://localhost:5274/"
  scopes: ["openid", "profile", "offline_access", "permission.center.api"]
  audience: "permission.center.api"
  # Empty: generate and persist the session key in data/oidc-session.key.
  session_secret: ""
