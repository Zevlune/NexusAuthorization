http:
  addr: ":8080"
logging:
  module: "NexusAuthorization"
  minimum_level: "info"
  file_path: ""
database:
  url: ""
  max_conns: 10
  min_conns: 2
# Service API authorization uses Redis by default. Set enabled: false to use
# database current-policy authorization without creating a Redis client.
redis:
  enabled: true
  url: ""
  key_prefix: "nexusauthorization:prod"
  cache_ttl: "24h"
  timeout: "200ms"
service_resource:
  source: "nexusauth"
  nexusauth_base_url: ""
  api_key: ""
  timeout: "5s"
authorization:
  # Keep /api/v1/authorize closed until unified Open API token management is integrated.
  service_credential: ""
scim:
  nexusauth_base_url: ""
  api_key: ""
  timeout: "5s"
oidc:
  enabled: true
  authority: ""
  client_id: "permission.center"
  client_secret: ""
  redirect_uri: ""
  post_logout_redirect_uri: ""
  scopes: ["openid", "profile", "offline_access", "permission.center.api"]
  audience: "permission.center.api"
  # Empty: generate and persist the session key in data/oidc-session.key.
  session_secret: ""
